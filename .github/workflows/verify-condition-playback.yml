name: Check mitochondrial playback
on:
  push:
    branches: [qa/condition-playback]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/step04-3d.spec.ts --grep 'cyanide playback|animation changes|a hidden tab|reduced motion'
