name: Verify deployed explorer in Chromium
on:
  push:
    branches: [qa/explorer-fhd-pr-3]
permissions:
  contents: read
jobs:
  published-page:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      VERIFIED_CSS: index-BdkYtqzU.css
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Wait for the verified stylesheet on the public Pages entry point
        run: |
          for attempt in $(seq 1 55); do
            if curl -fsSL -H 'Cache-Control: no-cache' https://suimaire.github.io/chemiosmosis-atp-explorer/ | grep -Fq "$VERIFIED_CSS"; then exit 0; fi
            sleep 12
          done
          exit 1
      - name: Check both diagrams, four readings, playback, preset and static mode on Pages
        run: node .github/qa/check-live.mjs
